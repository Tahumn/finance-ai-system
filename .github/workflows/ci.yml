name: CI Pipeline

on:
  push:
    branches: [ main, master, tnhu ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # - name: Lint with Ruff
      #   run: ruff check app
        
      - name: Run Backend Tests
        run: python -m pytest app/tests
        env:
          SECRET_KEY: "test-secret-key"
          ALGORITHM: "HS256"

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: frontend
        run: npm install
        
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: docker build -t finance-backend:test .
        
      - name: Build Frontend Image
        run: cd frontend && docker build -t finance-frontend:test .

  push-to-dockerhub:
    name: CD - Push to Docker Hub
    needs: [backend-tests, frontend-tests, docker-build-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/tnhu'
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/finance-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/finance-backend:latest
          
      - name: Build and push Frontend Image
        run: |
          cd frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/finance-frontend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/finance-frontend:latest
