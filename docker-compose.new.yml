services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-api
    env_file:
      - .env
    environment:
      # Keep sane defaults for local compose; `.env` can override.
      DB_URL: postgresql://finance_user:finance_pass@postgres:5432/finance_db
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DIFY_API_BASE: ${DIFY_API_BASE:-http://dify-api:5001/v1}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_FORCE_JSON: ${DIFY_FORCE_JSON:-true}
      DEV_RETURN_OTP: ${DEV_RETURN_OTP:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-10}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Microservice-style stack (optional). Uses the same codebase/image, but
  # runs separate FastAPI entrypoints + a lightweight gateway proxy.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-gateway
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth:8000
      FINANCE_SERVICE_URL: http://finance:8000
      NOTIFICATIONS_SERVICE_URL: http://notifications:8000
      AI_SERVICE_URL: http://ai:8000
    command: ["uvicorn", "app.gateway_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8005:8000"
    depends_on:
      auth:
        condition: service_started
      finance:
        condition: service_started
      notifications:
        condition: service_started
      notifications-worker:
        condition: service_started
      ai:
        condition: service_started
      planning:
        condition: service_started
      recurring:
        condition: service_started
    profiles: ["micro"]

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-auth
    env_file:
      - .env
    environment:
      DB_URL: ${AUTH_DB_URL:-postgresql://finance_user:finance_pass@postgres:5432/auth_db}
      DB_SCHEMA: ${AUTH_DB_SCHEMA:-auth_service}
    command: ["uvicorn", "app.services.auth_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["micro"]

  finance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-finance
    env_file:
      - .env
    environment:
      DB_URL: ${FINANCE_DB_URL:-postgresql://finance_user:finance_pass@postgres:5432/finance_db}
      DB_SCHEMA: ${FINANCE_DB_SCHEMA:-finance_service}
    command: ["uvicorn", "app.services.finance_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["micro"]

  planning:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-planning
    env_file:
      - .env
    environment:
      DB_URL: ${PLANNING_DB_URL:-postgresql://finance_user:finance_pass@postgres:5432/planning_db}
      DB_SCHEMA: ${PLANNING_DB_SCHEMA:-planning_service}
    command: ["uvicorn", "app.services.planning_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["micro"]

  recurring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-recurring
    env_file:
      - .env
    environment:
      DB_URL: ${RECURRING_DB_URL:-postgresql://finance_user:finance_pass@postgres:5432/recurring_db}
      DB_SCHEMA: ${RECURRING_DB_SCHEMA:-recurring_service}
    command: ["uvicorn", "app.services.recurring_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8007:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["micro"]

  notifications:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-notifications
    env_file:
      - .env
    environment:
      DB_URL: ${NOTIFICATIONS_DB_URL:-postgresql://finance_user:finance_pass@postgres:5432/notifications_db}
      DB_SCHEMA: ${NOTIFICATIONS_DB_SCHEMA:-notifications_service}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["uvicorn", "app.services.notifications_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["micro"]

  ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-ai
    env_file:
      - .env
    environment:
      # Current AI module still depends on finance data directly.
      DB_URL: ${AI_DB_URL:-postgresql://finance_user:finance_pass@postgres:5432/finance_db}
      DB_SCHEMA: ${AI_DB_SCHEMA:-finance_service}
    command: ["uvicorn", "app.services.ai_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["micro"]

  notifications-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-notifications-worker
    env_file:
      - .env
    environment:
      DB_URL: ${NOTIFICATIONS_DB_URL:-postgresql://finance_user:finance_pass@postgres:5432/notifications_db}
      DB_SCHEMA: ${NOTIFICATIONS_DB_SCHEMA:-notifications_service}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "-m", "app.workers.notifications_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["micro"]

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-seed
    env_file:
      - .env
    environment:
      DB_URL: postgresql://finance_user:finance_pass@postgres:5432/finance_db
      SEED_MONTHS: ${SEED_MONTHS:-6}
      SEED_FORCE: ${SEED_FORCE:-true}
      SEED_CREATE_DEMO_USER: ${SEED_CREATE_DEMO_USER:-true}
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@financeai.local}
      SEED_DEMO_USERNAME: ${SEED_DEMO_USERNAME:-demo_finance}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo@1234}
      SEED_BASE: ${SEED_BASE:-20260412}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/app/app/scripts/docker_seed.sh"]
    restart: "no"
    profiles: ["tools"]

  postgres:
    image: postgres:16-alpine
    container_name: finance-postgres
    environment:
